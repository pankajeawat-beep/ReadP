<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14232b">
<title>PDF Audio Reader</title>
<style>
:root{
  --paper:#f2f4f1; --panel:#ffffff; --ink:#15212a; --mute:#5d6b73; --line:#d5dbd8;
  --accent:#1d6b66; --on-accent:#fff; --mark:#ffe58a; --mark-ink:#15212a;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:Georgia,"Iowan Old Style","Times New Roman",serif;
  --fs:20px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e171c; --panel:#16232a; --ink:#e6ecea; --mute:#93a3a9; --line:#26363e;
  --accent:#5fd0c5; --on-accent:#08201e; --mark:#4d4313; --mark-ink:#fff4c2;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.icon:active{background:var(--line)}
.icon svg{width:24px;height:24px;fill:currentColor}
main{flex:1;overflow-y:auto;padding:20px 18px;scroll-behavior:smooth}
#empty{max-width:420px;margin:12vh auto 0;text-align:center}
#empty p{color:var(--mute);line-height:1.5}
.cta{display:block;width:100%;padding:16px;margin:12px 0;border-radius:14px;background:var(--accent);color:var(--on-accent);
  font-weight:700;font-size:17px;text-align:center}
.cta.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#text{max-width:640px;margin:0 auto;font-family:var(--read);font-size:var(--fs);line-height:1.7;padding-bottom:30vh}
#text span{border-radius:4px;padding:1px 0;cursor:pointer}
#text span.on{background:var(--mark);color:var(--mark-ink);box-decoration-break:clone;-webkit-box-decoration-break:clone}
#status{font:14px var(--ui);color:var(--mute);text-align:center;padding:6px 16px;min-height:28px}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#bar-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
#bar-top input{flex:1;accent-color:var(--accent)}
#bar-btns{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px}
#play{width:64px;height:64px;background:var(--accent);color:var(--on-accent)}
#play svg{width:30px;height:30px}
#speed{min-width:56px;height:44px;border-radius:22px;border:1px solid var(--line);font-weight:700}
#bar-btns .icon.sm svg{width:26px;height:26px}
dialog{border:0;border-radius:18px;background:var(--panel);color:var(--ink);width:min(92vw,420px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-weight:600;margin:14px 0 6px}
dialog select,dialog input[type=range]{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
dialog input[type=range]{padding:0;accent-color:var(--accent);border:0;background:none}
[hidden]{display:none!important}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 id="title">PDF Audio Reader</h1>
  <button class="icon" id="open-btn" aria-label="Open another PDF"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg></button>
  <button class="icon" id="set-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
</header>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<main id="main">
  <section id="empty">
    <h2>Listen to any PDF</h2>
    <p>Pick a PDF and it is read aloud sentence by sentence. Works fully offline, and your place is saved.</p>
    <button class="cta" id="pick">Choose a PDF</button>
    <button class="cta alt" id="resume" hidden>Continue last book</button>
  </section>
  <article id="text" hidden></article>
</main>

<div id="status">Choose a PDF to begin</div>

<footer id="bar" hidden>
  <div id="bar-top"><span id="pg">Page 1</span><input type="range" id="seek" min="1" value="1" aria-label="Jump to page"><span id="pct">0%</span></div>
  <div id="bar-btns">
    <button id="speed" aria-label="Reading speed">1.0×</button>
    <button class="icon sm" id="prev" aria-label="Previous sentence"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
    <button class="icon" id="play" aria-label="Play"></button>
    <button class="icon sm" id="next" aria-label="Next sentence"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="icon sm" id="stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg></button>
  </div>
</footer>

<dialog id="dlg">
  <h3 style="margin:0">Settings</h3>
  <label for="voice">Voice</label><select id="voice"></select>
  <label for="size">Text size</label><input type="range" id="size" min="16" max="32" step="1">
  <button class="cta" id="close" style="margin-top:20px">Done</button>
</dialog>

<script type="module">
import * as pdfjs from './pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = new URL('./pdf.worker.min.mjs', import.meta.url).href;

const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
};
const SPEEDS = [0.8, 1, 1.2, 1.5, 1.8, 2.2];

let S = [], P = [], idx = 0, playing = false, token = 0, name = '', pages = 0, shownPage = 0, voices = [], wake = null;
const cfg = Object.assign({ voice:'', speed:1, size:20 }, JSON.parse(localStorage.getItem('par-cfg') || '{}'));
const saveCfg = () => localStorage.setItem('par-cfg', JSON.stringify(cfg));

/* ---------- storage: keep the last book so it can be resumed offline ---------- */
const idb = () => new Promise((ok, no) => {
  const r = indexedDB.open('par', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('k');
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const idbGet = async k => { try { const d = await idb(); return await new Promise(ok => { const q = d.transaction('k').objectStore('k').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(); }); } catch { return; } };
const idbSet = async (k, v) => { try { const d = await idb(); d.transaction('k', 'readwrite').objectStore('k').put(v, k); } catch {} };

/* ---------- UI helpers ---------- */
const setStatus = t => $('status').textContent = t;
const setPlayIcon = () => { $('play').innerHTML = playing ? ICON.pause : ICON.play; $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play'); };
document.documentElement.style.setProperty('--fs', cfg.size + 'px');
$('speed').textContent = cfg.speed.toFixed(1) + '×';
setPlayIcon();

/* ---------- voices ---------- */
function loadVoices() {
  voices = synth.getVoices();
  const lang = (navigator.language || 'en').slice(0, 2);
  voices.sort((a, b) => (b.lang.startsWith(lang) - a.lang.startsWith(lang)) || a.name.localeCompare(b.name));
  $('voice').innerHTML = voices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('') || '<option>Default voice</option>';
  if (cfg.voice && voices.some(v => v.name === cfg.voice)) $('voice').value = cfg.voice;
}
loadVoices();
synth.onvoiceschanged = loadVoices;

/* ---------- PDF -> sentences ---------- */
function splitSentences(text) {
  const out = [];
  for (const raw of text.match(/[^.!?]+(?:[.!?]+["')\]]*|$)/g) || []) {
    let s = raw.trim();
    while (s.length > 260) {               // long run-ons: cut at a comma/semicolon/space so TTS never truncates
      let cut = Math.max(s.lastIndexOf('; ', 240), s.lastIndexOf(', ', 240));
      if (cut < 80) cut = s.lastIndexOf(' ', 240);
      if (cut < 1) cut = 240;
      out.push(s.slice(0, cut + 1).trim()); s = s.slice(cut + 1).trim();
    }
    if (s.length > 1) out.push(s);
  }
  return out;
}

async function loadPdf(file) {
  stop(); name = file.name.replace(/\.pdf$/i, '');
  setStatus('Reading PDF…'); $('empty').hidden = true;
  try {
    const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    pages = pdf.numPages; S = []; P = [];
    for (let p = 1; p <= pages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent();
      let t = tc.items.map(i => i.str + (i.hasEOL ? '\n' : ' ')).join('');
      t = t.replace(/-\n(?=[a-z])/g, '').replace(/\s*\n\s*/g, ' ').replace(/\s{2,}/g, ' ');
      for (const s of splitSentences(t)) { S.push(s); P.push(p); }
      if (p % 10 === 0 || p === pages) setStatus(`Reading PDF… page ${p} of ${pages}`);
    }
    if (!S.length) { setStatus('No text found. This PDF may be scanned images, which cannot be read aloud.'); $('empty').hidden = false; return; }
    idx = 0;
    await idbSet('book', { name, S, P, pages, idx: 0 });
    openBook();
  } catch (e) {
    console.error(e); setStatus('Could not read this PDF. Try another file.'); $('empty').hidden = false;
  }
}

function openBook() {
  $('title').textContent = name;
  $('empty').hidden = true; $('text').hidden = false; $('bar').hidden = false;
  $('seek').max = pages; shownPage = 0;
  render(); mark(false);
  setStatus('Ready. Tap play, or tap any sentence to start there.');
}

/* ---------- reading pane (renders one page at a time, so huge books stay fast) ---------- */
function render() {
  const p = P[idx]; if (p === shownPage) return; shownPage = p;
  let a = idx; while (a > 0 && P[a - 1] === p) a--;
  let html = '';
  for (let i = a; i < S.length && P[i] === p; i++) html += `<span data-i="${i}">${S[i].replace(/&/g, '&amp;').replace(/</g, '&lt;')} </span>`;
  $('text').innerHTML = html;
  $('main').scrollTop = 0;
}
function mark(scroll = true) {
  render();
  document.querySelector('#text .on')?.classList.remove('on');
  const el = document.querySelector(`#text [data-i="${idx}"]`);
  if (el) { el.classList.add('on'); if (scroll) el.scrollIntoView({ block: 'center' }); }
  $('pg').textContent = `Page ${P[idx]} / ${pages}`;
  $('seek').value = P[idx];
  $('pct').textContent = Math.round(idx / Math.max(1, S.length - 1) * 100) + '%';
  localStorage.setItem('par-idx', idx);
  if (idx % 5 === 0) idbGet('book').then(b => b && idbSet('book', { ...b, idx }));
}
$('text').addEventListener('click', e => {
  const s = e.target.closest('span[data-i]'); if (!s) return;
  idx = +s.dataset.i; mark(false); play();
});

/* ---------- speech engine: one sentence at a time (reliable pause, speed change, resume) ---------- */
function speak() {
  if (!playing) return;
  if (idx >= S.length) { stop(); setStatus('Finished.'); idx = 0; mark(false); return; }
  const my = ++token, u = new SpeechSynthesisUtterance(S[idx]);
  const v = voices.find(v => v.name === cfg.voice); if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = cfg.speed;
  const next = () => { if (my === token && playing) { idx++; mark(); speak(); } };
  u.onend = next;
  u.onerror = e => { if (e.error === 'canceled' || e.error === 'interrupted') return; next(); };
  mark();
  synth.cancel();
  setTimeout(() => { if (my === token) synth.speak(u); }, 40);
}
async function play() {
  if (!S.length) return;
  playing = true; setPlayIcon(); setStatus('Reading…');
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
  speak();
}
function pause() { playing = false; token++; synth.cancel(); setPlayIcon(); setStatus('Paused'); wake?.release?.(); }
function stop() { playing = false; token++; synth.cancel(); setPlayIcon(); wake?.release?.(); }
function jump(n) { idx = Math.min(S.length - 1, Math.max(0, n)); mark(); if (playing) speak(); }

$('play').onclick = () => playing ? pause() : play();
$('prev').onclick = () => jump(idx - 1);
$('next').onclick = () => jump(idx + 1);
$('stop').onclick = () => { stop(); idx = 0; mark(); setStatus('Stopped. Back at the start.'); };
$('speed').onclick = () => {
  const i = SPEEDS.findIndex(s => Math.abs(s - cfg.speed) < .05);
  cfg.speed = SPEEDS[(i + 1) % SPEEDS.length]; saveCfg();
  $('speed').textContent = cfg.speed.toFixed(1) + '×';
  if (playing) speak();
};
$('seek').oninput = e => { const p = +e.target.value; const i = P.findIndex(x => x >= p); if (i >= 0) jump(i); };

/* ---------- file + settings ---------- */
const chooser = () => $('file').click();
$('pick').onclick = chooser; $('open-btn').onclick = chooser;
$('file').onchange = e => { const f = e.target.files[0]; if (f) loadPdf(f); e.target.value = ''; };
$('set-btn').onclick = () => { $('size').value = cfg.size; $('dlg').showModal(); };
$('close').onclick = () => $('dlg').close();
$('voice').onchange = e => { cfg.voice = e.target.value; saveCfg(); if (playing) speak(); };
$('size').oninput = e => { cfg.size = +e.target.value; saveCfg(); document.documentElement.style.setProperty('--fs', cfg.size + 'px'); };

$('resume').onclick = async () => {
  const b = await idbGet('book'); if (!b) return;
  ({ name, S, P, pages, idx } = b); openBook(); idx = Math.min(idx || 0, S.length - 1); mark(false);
};
idbGet('book').then(b => { if (b) { $('resume').hidden = false; $('resume').textContent = `Continue “${b.name}”`; } });

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', pause);
  navigator.mediaSession.setActionHandler('nexttrack', () => jump(idx + 1));
  navigator.mediaSession.setActionHandler('previoustrack', () => jump(idx - 1));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && playing && !synth.speaking) speak(); });
</script>
</body>
</html>
